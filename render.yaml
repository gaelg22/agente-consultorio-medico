services:
  - type: web
    name: agente-doctor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn agente_kapso:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: KAPSO_API_KEY
        sync: false
      - key: KAPSO_PHONE_NUMBER_ID
        sync: false
      - key: KAPSO_WEBHOOK_SECRET
        sync: false
